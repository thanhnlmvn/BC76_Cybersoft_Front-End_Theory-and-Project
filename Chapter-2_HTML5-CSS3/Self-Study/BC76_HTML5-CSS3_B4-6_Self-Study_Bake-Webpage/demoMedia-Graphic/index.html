<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>

    <style>
      .svg1 {
        border: 1px solid #666;
        width: 400px;
        height: 300px;
      }

      .svg1 rect {
        fill: red;
        stroke: black;
        stroke-width: 4px;
        width: 150px;
        height: 150px;
      }

      .svg2 {
        width: 400px;
        height: 300px;
      }

      .svg2 circle {
        fill: red;
      }

      .svg2 text {
        fill: white;
        font-size: 70px;
        font-weight: 700;
      }
    </style>
  </head>
  <body>
    <!-- Thuộc tính controls sẽ tạo cho video những button điều khiển -->
    <!-- Thuộc tính preload chỉ định xem tác giả có cho rằng video nên được tải khi trang tải hay không và tải như thế nào. -->
    <!-- Thuộc tính loop sẽ điều chỉnh giá trị boolean để video chạy lại sau khi kết thức không -->
    <!-- Thuộc tính autoplay điều chỉnh video sẽ tự chạy khi khởi động trang web -->
    <!-- Thuộc tính muted tắt âm thanh khi video được khởi động vì một số trình duyệt sẽ chặn autoplay khi khởi động có âm thanh -->
    <video
      width="320"
      height="240"
      controls
      preload="none"
      loop="true"
      autoplay
      muted
    >
      <source src="./../asset/video.mp4" type="video/mp4" />
    </video>

    <audio controls>
      <source
        src="./../asset/CORTIS (코르티스) REDRED Official MV.mp3"
        type="audio/mpeg"
      />
    </audio>

    <svg class="svg1">
      <rect x="100px" y="50px" rx="10px" ry="10px"></rect>
    </svg>

    <svg class="svg2">
      <circle cx="200px" cy="150px" r="80px"></circle>
      <text x="150px" y="172px">GF</text>
    </svg>
  </body>
</html>
